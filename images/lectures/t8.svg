<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" role="img" aria-label="A log line with numbers picked out by a regular expression">
<title>A log line with numbers picked out by a regular expression</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#3b82f6" stop-opacity="0.13"/>
<stop offset="1" stop-color="#8b5cf6" stop-opacity="0.13"/>
</linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="0.9" fill="#64748b" fill-opacity="0.22"/>
</pattern>
</defs>
<rect width="400" height="120" fill="url(#bg)"/>
<rect width="400" height="120" fill="url(#dots)"/>
<text x="24" y="40" font-size="14" font-family="'IBM Plex Mono',ui-monospace,monospace" fill="#64748b"><tspan fill="#64748b">2026-10-05 </tspan><tspan fill="#3b82f6">T=</tspan><tspan fill="#8b5cf6" font-weight="600">350.2</tspan><tspan fill="#3b82f6">K P=</tspan><tspan fill="#8b5cf6" font-weight="600">5.10</tspan><tspan fill="#3b82f6">bar</tspan></text><text x="24" y="76" font-size="13" font-family="'IBM Plex Mono',ui-monospace,monospace" fill="#14b8a6">re.findall(r"\d+\.?\d*", line)</text><text x="24" y="104" font-size="12" font-family="'IBM Plex Mono',ui-monospace,monospace" fill="#f59e0b">tag.startswith("TIC")  line.split(",")</text>
</svg>
