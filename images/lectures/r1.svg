<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" role="img" aria-label="A main branch with a feature branch splitting off and merging back through a pull request">
<title>A main branch with a feature branch splitting off and merging back through a pull request</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#3b82f6" stop-opacity="0.13"/>
<stop offset="1" stop-color="#8b5cf6" stop-opacity="0.13"/>
</linearGradient>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="0.9" fill="#64748b" fill-opacity="0.22"/>
</pattern>
</defs>
<rect width="400" height="120" fill="url(#bg)"/>
<rect width="400" height="120" fill="url(#dots)"/>

<path d="M30 80 H370" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
<path d="M110 80 C130 80 130 36 160 36 H250 C280 36 280 80 300 80" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
<g fill="#3b82f6">
<circle cx="40" cy="80" r="7"/><circle cx="80" cy="80" r="7"/><circle cx="110" cy="80" r="7"/><circle cx="340" cy="80" r="7"/><circle cx="370" cy="80" r="7"/>
</g>
<g fill="#8b5cf6">
<circle cx="170" cy="36" r="7"/><circle cx="210" cy="36" r="7"/><circle cx="245" cy="36" r="7"/>
</g>
<circle cx="300" cy="80" r="9" fill="#14b8a6"/>
<text x="110" y="104" font-size="10" font-family="'IBM Plex Mono',ui-monospace,monospace" fill="#64748b" text-anchor="middle">main</text>
<text x="208" y="20" font-size="10" font-family="'IBM Plex Mono',ui-monospace,monospace" fill="#8b5cf6" text-anchor="middle">feature/model</text>
<text x="300" y="104" font-size="10" font-family="'IBM Plex Mono',ui-monospace,monospace" fill="#14b8a6" text-anchor="middle">PR merged</text>
</svg>
