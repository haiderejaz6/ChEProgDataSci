name: Deploy Slides

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install jupyter nbconvert

      - name: Convert Marp lecture decks to standalone HTML
        run: |
          mkdir -p _site/lectures
          npx --yes @marp-team/marp-cli@latest --input-dir lectures --html -o _site/lectures

      - name: Convert notebooks to slides, HTML, and copy raw notebooks
        run: |
          mkdir -p _site
          for nb in *.ipynb; do
            # Reveal.js slideshow (e.g. T1_ChemEng_Intro_Commented.slides.html)
            jupyter nbconvert --to slides "$nb" --output-dir _site

            # Static rendered "read" page (e.g. T1_ChemEng_Intro_Commented.html)
            jupyter nbconvert --to html "$nb" --output-dir _site \
              --HTMLExporter.theme=light

            # Raw notebook, downloadable / openable in Colab or JupyterLite
            cp "$nb" "_site/$nb"
          done
          cp index.html _site/index.html
          cp outline.html _site/outline.html
          cp ontology.html _site/ontology.html
          cp archive.html _site/archive.html
          cp favicon.png _site/favicon.png
          cp -r images _site/images
          cp -r assets _site/assets
          cp -r data _site/data
          echo "=== Files in _site ==="
          ls -la _site/

      - name: Build the Fall 2025 archive (frozen notebooks + past papers)
        run: |
          mkdir -p _site/archive/fall25/exams

          # Frozen notebooks: same read page / slides / raw triplet as the live
          # ones, but built from archive/fall25 so they never change.
          for nb in archive/fall25/*.ipynb; do
            [ -e "$nb" ] || continue
            jupyter nbconvert --to slides "$nb" --output-dir _site/archive/fall25
            jupyter nbconvert --to html "$nb" --output-dir _site/archive/fall25 \
              --HTMLExporter.theme=light
            cp "$nb" "_site/archive/fall25/$(basename "$nb")"
          done

          # Past papers: PDFs served as-is, exam notebooks also get a read page.
          for nb in archive/fall25/exams/*.ipynb; do
            [ -e "$nb" ] || continue
            jupyter nbconvert --to html "$nb" --output-dir _site/archive/fall25/exams \
              --HTMLExporter.theme=light
          done
          find archive/fall25/exams -maxdepth 1 -type f \
            \( -name '*.pdf' -o -name '*.ipynb' \) \
            -exec cp {} _site/archive/fall25/exams/ \;

          echo "=== Files in _site/archive/fall25 ==="
          ls -la _site/archive/fall25/ _site/archive/fall25/exams/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
