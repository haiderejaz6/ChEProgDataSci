name: Deploy Slides

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install jupyter nbconvert

      - name: Convert notebooks to slides, HTML, and copy raw notebooks
        run: |
          mkdir -p _site
          for nb in *.ipynb; do
            # Reveal.js slideshow (e.g. T1_ChemEng_Intro_Commented.slides.html)
            jupyter nbconvert --to slides "$nb" --output-dir _site

            # Static rendered "read" page (e.g. T1_ChemEng_Intro_Commented.html)
            jupyter nbconvert --to html "$nb" --output-dir _site \
              --HTMLExporter.theme=light

            # Raw notebook, downloadable / openable in Colab or JupyterLite
            cp "$nb" "_site/$nb"
          done
          cp index.html _site/index.html
          cp favicon.png _site/favicon.png
          echo "=== Files in _site ==="
          ls -la _site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
